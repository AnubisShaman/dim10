<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 будинок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
/* ===== Кольори фасаду 10 будинку ===== */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#23262B; --muted:#5F6670; --line:#E6E8EB; --line2:#D5D9DE;
  --graph:#4A4F57; --grey:#A9AFB7; --yellow:#F2C12E; --yellow-d:#DFAE1C;
  --ok-bg:#DCEFE5; --ok:#1E6B4A; --bad-bg:#F7E0DA; --bad:#8A2E12; --info-bg:#E6E8EB; --info:#3A3F47; --soft:#EEF0F2; --yel-bg:#FCEFC2; --yel-ink:#6B5300;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-size:.9375rem;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:18px 16px 112px;display:flex;flex-direction:column;gap:14px}
.h1{font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.h2{font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0}
.sub{font-size:13px;color:var(--muted);font-weight:600}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:15px;font-weight:700}
.t-ok{color:var(--ok)} .t-bad{color:var(--bad)} .t-info{color:var(--info)}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)} .tag.soft{background:var(--soft);color:var(--graph)}
.tag.yel{background:var(--yel-bg);color:var(--yel-ink)}
.btn{height:48px;border:none;border-radius:16px;padding:0 16px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.yellow{background:var(--yellow);color:var(--ink);font-weight:800} .btn.green{background:var(--ok)} .btn.graph{background:var(--graph)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:36px;border-radius:12px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:46px;height:46px;border-radius:16px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scope{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
/* світло по секціях */
.lightc{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sec{display:flex;flex-direction:column;align-items:center;gap:8px}
.col{width:100%;height:104px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;transition:background .3s}
.col.on{background:repeating-linear-gradient(180deg,#F2C12E 0 16px,#DFAE1C 16px 18px)}
.col.off{background:repeating-linear-gradient(180deg,#4A4F57 0 16px,#3F444B 16px 18px)}
.col.unknown{background:repeating-linear-gradient(180deg,#D5D9DE 0 16px,#C6CBD1 16px 18px)}
.col.me{outline:2.5px solid var(--ink);outline-offset:3px}
.sec .lb{font-size:12px;font-weight:600;color:var(--muted)} .sec.me .lb{font-weight:800;color:var(--ink)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px} .legend i{width:10px;height:10px;border-radius:3px;display:block}
.mark{background:var(--bg);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mark .btn{background:var(--card);color:var(--ink)}
.mark .btn.pon{background:var(--yellow)} .mark .btn.poff{background:var(--graph);color:#fff}
.sec .age{font-size:11px;font-weight:500;color:var(--muted);margin-top:-6px}
.col{position:relative}
.pend{position:absolute;top:7px;right:7px;width:12px;height:12px;border-radius:6px;border:2px solid #fff;box-sizing:border-box}
.pend.on{background:#F2C12E} .pend.off{background:#4A4F57}
.legend .pdot{background:linear-gradient(90deg,#F2C12E 50%,#4A4F57 50%);border-radius:6px}
.pendbox{background:var(--yel-bg);color:var(--yel-ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.4}
.fuel{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.fuel.on{background:var(--card);box-shadow:0 0 0 1.5px rgba(30,107,74,.28),0 8px 28px rgba(46,160,103,.28),0 2px 6px rgba(30,107,74,.12)} .fuel.grace{background:var(--yel-bg)} .fuel.off{background:var(--bad-bg)}
.keyrow{display:flex;align-items:center;gap:12px}
.keyic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fuel.on .keyic{background:var(--ok-bg);box-shadow:0 0 0 4px rgba(46,160,103,.14),0 0 18px rgba(46,160,103,.55)} .fuel.grace .keyic{background:var(--yellow)} .fuel.off .keyic{background:#fff}
.banner{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:none;text-align:left;width:100%}
.banner.grace{background:var(--yel-bg);color:var(--yel-ink)} .banner.off{background:var(--bad-bg);color:var(--bad)}
.aptlist{display:flex;flex-wrap:wrap;gap:6px}
.aptlist span{background:var(--bg);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.input{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card);padding:0 14px;color:var(--ink);font-size:15px}
textarea.input{height:96px;padding:12px 14px;resize:none;line-height:1.4}
.note{background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;background:var(--card);border-radius:26px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 6px 24px rgba(35,38,43,.10)}
nav.tabs button{height:54px;border:none;border-radius:20px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{background:var(--yellow);color:var(--ink);font-weight:800}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;max-width:90%;text-align:center}
.skel{background:linear-gradient(90deg,#E3E6EA,#EEF0F2,#E3E6EA);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}
.center{min-height:86vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px}
.facade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:8px}
.facade i{display:block;height:36px;border-radius:6px}
.dark{background:var(--ink);color:#fff}
.lifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lift{height:44px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.lift i{width:8px;height:8px;border-radius:4px;display:block}
.lift.ok{background:var(--ok-bg);color:var(--ok)} .lift.ok i{background:var(--ok)}
.lift.bad{background:var(--bad-bg);color:var(--bad)} .lift.bad i{background:#C4302A}
.chatbtn{height:36px;padding:0 12px;border-radius:18px;border:none;background:var(--card);color:var(--ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.admin-line{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.admin-line:last-child{border-bottom:none}
.mem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:20px;background:var(--line);color:var(--ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av.y{background:var(--yellow)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slots i{display:block;height:6px;border-radius:3px;background:var(--line2)} .slots i.f{background:var(--yellow)} .slots i.p{background:var(--grey)}
.invite{background:var(--yel-bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.invite code{font-size:13px;word-break:break-all;color:var(--yel-ink);font-family:inherit;font-weight:700}
a{color:var(--graph)}

/* ===== Apple-шар (скилл apple-design) =====
   §1 відгук на натискання · §3-4 пружини (damping 1.0) · §7 просторова узгодженість
   §12 матеріали і глибина · §14 reduced motion / transparency / contrast · §15 типографіка */
:root{
  --spring:cubic-bezier(.22,1,.36,1);
  --press:100ms;
  --glass:rgba(255,255,255,.72);
  --shadow-1:0 1px 2px rgba(35,38,43,.05);
  --shadow-2:0 1px 2px rgba(35,38,43,.05),0 8px 24px rgba(35,38,43,.07);
  --shadow-3:0 2px 4px rgba(35,38,43,.06),0 14px 36px rgba(35,38,43,.14);
}

/* типографіка: великий текст стискаємо, дрібний трохи розкриваємо */
.h1{font-weight:700;font-size:1.625rem;line-height:1.08;letter-spacing:-.022em;text-wrap:balance}
.h2{font-weight:700;font-size:1.3125rem;line-height:1.15;letter-spacing:-.016em;text-wrap:balance}
.label{font-weight:600;letter-spacing:.07em}
.sub,.tile .k,.tag,.legend,.sec .lb,.sec .age{letter-spacing:.01em}

/* §1 відгук одразу на дотик, повернення пружиною */
button,a.iconbtn,.card[onclick]{touch-action:manipulation;transition:transform 240ms var(--spring),background-color 160ms ease,color 160ms ease,border-color 160ms ease,opacity 160ms ease}
button:active,a.iconbtn:active{transform:scale(.97);transition-duration:var(--press),160ms,160ms,160ms,160ms}
.card[onclick]:active{transform:scale(.985);transition-duration:var(--press),160ms,160ms,160ms,160ms}
button:disabled:active{transform:none}
nav.tabs button:active{transform:scale(.94)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.input:focus{border-color:var(--graph);outline:none;box-shadow:0 0 0 3px rgba(242,193,46,.45)}

/* §12 глибина: чим більша поверхня, тим глибша тінь */
.card{box-shadow:var(--shadow-1)}
.card.dark{box-shadow:var(--shadow-2)}
.lightc{box-shadow:var(--shadow-2);border-radius:28px}

/* §12 нижня панель як скляний матеріал, контент ковзає під нею */
nav.tabs{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow-3),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 1px 0 rgba(255,255,255,.9);z-index:5;isolation:isolate}
nav.tabs button{position:relative;z-index:1;color:var(--graph);font-weight:600;letter-spacing:.01em}
nav.tabs button.on{background:transparent;color:var(--ink);font-weight:700}
nav.tabs .pill{position:absolute;z-index:0;top:8px;bottom:8px;left:8px;width:calc((100% - 28px) / 4);border-radius:20px;background:var(--yellow);transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform 320ms var(--spring)}
/* §12 замість жорсткої межі: м'яке згасання знизу там, де плаваюча панель накладається на контент */
.edge{position:fixed;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom));pointer-events:none;z-index:4;background:linear-gradient(to top,rgba(242,243,245,.94),rgba(242,243,245,0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent)}

/* §7 екрани: вхід і вихід тим самим шляхом. Вперед справа, назад зліва, вкладки без зсуву */
@keyframes enter-r{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enter-l{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes enter-f{from{opacity:0}to{opacity:1}}
@keyframes fade-out{to{opacity:0}}
.screen.in-push{animation:enter-r 320ms var(--spring) backwards}
.screen.in-pop{animation:enter-l 280ms var(--spring) backwards}
.screen.in-tab{animation:enter-f 150ms ease-out backwards}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in-push .bar>i,.in-pop .bar>i,.in-tab .bar>i,.in-bars .bar>i{transform-origin:left;animation:grow 500ms var(--spring) 60ms backwards}

/* зміна статусу світла в секції: колонка «осідає» */
@keyframes settle{from{transform:scale(.93);filter:brightness(1.1)}to{transform:none;filter:none}}
.col.changed{animation:settle 520ms var(--spring)}

/* тост матеріалізується (розмиття і масштаб разом), а не просто з'являється */
.toast{background:rgba(35,38,43,.84);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--shadow-3);letter-spacing:.005em;animation:mat-in 300ms var(--spring) backwards}
.toast.out{animation:mat-out 180ms cubic-bezier(.23,1,.32,1) forwards}
@keyframes mat-in{from{opacity:0;filter:blur(10px);transform:translateX(-50%) translateY(10px) scale(.94)}to{opacity:1;filter:none;transform:translateX(-50%)}}
@keyframes mat-out{to{opacity:0;filter:blur(8px);transform:translateX(-50%) scale(.96)}}

/* §14 зменшений рух: перехід через прозорість замість зсувів і пружин */
@media (prefers-reduced-motion:reduce){
  .screen.in-push,.screen.in-pop{animation:enter-f 200ms ease-out backwards}
  .in-push .bar>i,.in-pop .bar>i,.in-tab .bar>i,.in-bars .bar>i{animation:none}
  .col.changed{animation:none}
  .skel{animation:none}
  .toast{animation:enter-f 200ms ease-out backwards}
  .toast.out{animation:fade-out 150ms ease-out forwards}
  nav.tabs .pill{transition:none}
  button:active,a.iconbtn:active,.card[onclick]:active,nav.tabs button:active{transform:none;opacity:.7}
}
@media (prefers-reduced-transparency:reduce){
  nav.tabs{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
  .edge{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(to top,var(--bg),rgba(242,243,245,0))}
  .toast{background:var(--ink);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){
  nav.tabs{background:#fff;box-shadow:var(--shadow-3),inset 0 0 0 1.5px var(--graph)}
  .card{box-shadow:inset 0 0 0 1px var(--line2)}
  .sub,.tile .k{color:var(--ink)}
}

/* ===== Аудит (web-design-guidelines + emil-design-eng) ===== */
html,body{touch-action:manipulation}             /* без зуму подвійним тапом, щіпок працює */
body{text-wrap:pretty}
.input,input.input,textarea.input{font-size:16px} /* iOS не наближає поле при фокусі */
/* зона нажимання ≥ 44px без зміни вигляду */
.chip,.btn.sm,.chatbtn,.scope{position:relative}
.chip::before,.btn.sm::before,.chatbtn::before,.scope::before{content:"";position:absolute;inset:-6px}
/* колір не єдиний сигнал: ліфт, що не працює, закреслений */
.lift.bad{text-decoration:line-through;text-decoration-thickness:1.5px}
.card[onclick]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* запит триває довше 150 мс: кнопки притухають */
.is-busy{cursor:progress}
.is-busy .btn{opacity:.6}

/* ===== Швидкий старт: дані зі збереженого, поки йде оновлення ===== */
body.loading::after{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:linear-gradient(90deg,transparent,var(--yellow-d),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:topload 1.1s linear infinite}
@keyframes topload{from{background-position:-40% 0}to{background-position:140% 0}}
.lightc.stale .col,.lightc.stale .mark{opacity:.45;filter:grayscale(.7);transition:opacity 200ms ease}
@media (prefers-reduced-motion:reduce){body.loading::after{animation:none;background:var(--yellow-d);opacity:.6}}
/* ===== Коментарі до заявок ===== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cmts{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.cmt{background:var(--bg);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.cmt.adm{background:var(--yel-bg)}
.cmt .h{display:flex;gap:8px;align-items:baseline;font-size:12px;font-weight:700;color:var(--muted)}
.cmt .h b{color:var(--ink)}
.cmt .x{font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.cmt .del{margin-left:auto;border:none;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:4px;position:relative}
.cmt .del::before{content:"";position:absolute;inset:-10px}
.cmtlink{align-self:flex-start;border:none;background:none;padding:6px 0;color:var(--ink);font:inherit;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
/* ===== ОСББ: внески (адмін) ===== */
.fl{display:grid;grid-template-columns:26px repeat(8,minmax(0,1fr));gap:3px;align-items:stretch}
.fl .f{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.fl .a{border:none;font:inherit;color:inherit;border-radius:7px;background:var(--bg);padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:34px;font-variant-numeric:tabular-nums}
.fl .a b{font-size:11px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.fl .a i{font-style:normal;font-size:10px;font-weight:700}
.fl .a.p{background:var(--ok-bg);color:var(--ok)}
.fl .a.hit,.fl .a.sel{outline:2px solid var(--ink);outline-offset:1px}
.fl .a.l{box-shadow:inset 0 -3px 0 var(--yellow-d)}
.osed{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.flwrap{overflow-x:auto;display:flex;flex-direction:column;gap:3px}
.fl .a.pt{background:var(--yel-bg);color:var(--yel-ink)}
.fl .a.ov{background:var(--info-bg);color:var(--info)}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* ===== Пальне: адмін ===== */
[hidden]{display:none!important}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{flex:1;min-width:0;height:36px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
.pay{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:none;padding-top:0}
.pay .amt{font-weight:800;font-size:16px}
.pay .who{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.pay .what{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hint{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--yel-bg);color:var(--yel-ink);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600}
.aptrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:6px 2px;border:none;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;font:inherit}
.aptrow:first-child{border-top:none}
.aptrow .n{font-weight:800;font-size:16px;min-width:64px}
.aptrow .s{margin-left:auto;font-weight:700;font-size:14px}
.aptopen{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;margin:2px 0 8px}

/* ===== Світло: фасад, поверхи, генератор ===== */
.facadec{background:linear-gradient(180deg,#F7F8FA 0%,#E9ECF0 100%);border-radius:22px;padding:14px 10px 10px;box-shadow:inset 0 0 0 1px rgba(35,38,43,.06);position:relative;transition:box-shadow 400ms ease}
.facadec.gen{box-shadow:inset 0 0 0 1.5px rgba(46,160,103,.45),0 0 0 4px rgba(46,160,103,.08)}
.lfac{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tower{border:none;font:inherit;color:inherit;text-align:center;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#D9DDE3,#CDD2D9);padding:6px 5px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(35,38,43,.08)}
.tower.me{box-shadow:inset 0 0 0 2px var(--ink)}
.tower .nm{font-size:11px;font-weight:800;color:#5F6670;letter-spacing:.04em;margin-bottom:2px}
.frw{display:flex;gap:2px;height:9px;border-radius:2px}
.frw .w{flex:1;border-radius:1.5px;background:#4A4F57}
.frw.on .w{background:#FFCF4A;box-shadow:0 0 5px rgba(242,193,46,.75)}
.frw.on .w:nth-child(3n){background:#F7B733}
.frw.on.inf .w{background:#F7DE8C;box-shadow:none}
.frw.unknown .w{background:repeating-linear-gradient(135deg,#C3C8CF 0 2px,transparent 2px 4px)}
.frw.pd{outline:1px dashed #B88A00;outline-offset:1px}
.frw.mine{outline:1.5px solid var(--ink);outline-offset:1px}
.tower .base{height:8px;margin-top:5px;border-radius:3px;background:#B9BFC7}
.tower .cnt{font-size:11px;font-weight:800;color:#3A3F47;margin-top:5px}
@keyframes ignite{0%{background:#4A4F57;box-shadow:none}55%{background:#FFF3C4;box-shadow:0 0 12px rgba(255,210,90,.95)}100%{}}
.ign .frw.on .w{animation:ignite 520ms var(--spring) backwards;animation-delay:calc(var(--d) * 1ms)}
.genp{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px}
.genp.on{background:#DCEFE5;color:#1E6B4A}
.genp.off{background:var(--bg);color:var(--muted)}
.genp .dot{width:10px;height:10px;border-radius:50%;background:#9AA1AB;flex-shrink:0}
.genp.on .dot{background:#2EA067;box-shadow:0 0 0 4px rgba(46,160,103,.18),0 0 12px rgba(46,160,103,.8)}
.genp small{font-weight:600;opacity:.8;margin-left:auto;white-space:nowrap}
@keyframes genon{0%{transform:scale(.96);box-shadow:0 0 0 0 rgba(46,160,103,.5)}60%{box-shadow:0 0 0 10px rgba(46,160,103,0)}100%{transform:none}}
.genp.on.flash{animation:genon 700ms var(--spring)}
.flist{display:flex;flex-direction:column;gap:3px}
.flr{display:grid;grid-template-columns:34px 1fr 86px;align-items:center;gap:8px;padding:6px 6px;border-radius:12px;border:none;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.flr .n{font-weight:800;font-size:14px;color:var(--muted)}
.fapts{display:grid;gap:3px}
.fa{height:22px;border-radius:5px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;background:var(--bg);color:var(--muted);white-space:nowrap;overflow:hidden}
.fa.s{font-size:8px;letter-spacing:-.04em}
.flr.on .fa{background:#FFF3C4;color:#6B5300}
.flr.on.inf .fa{background:#FBF4DA;color:#8A7A44}
.flr.off .fa{background:#4A4F57;color:#D5D9DE}
.flr.unknown .fa{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}
.flst{font-size:11px;font-weight:700;text-align:right;line-height:1.25}
.flst em{display:block;font-style:normal;font-weight:600;color:var(--muted);font-size:10px}
.flst.on{color:var(--ok)} .flst.off{color:var(--bad)} .flst.unknown{color:var(--muted)}
.hrow{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.hbar{height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--line)}
.hbar i{display:block;height:100%}
.hbar i.on{background:linear-gradient(#FFCF4A,#F2B21E)} .hbar i.off{background:#4A4F57} .hbar i.unknown{background:var(--line2)}
.hbar.g i.on{background:linear-gradient(#5CC68E,#2EA067)}
.hax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:600;padding-left:38px}
.scrim2{position:fixed;inset:0;background:rgba(10,12,16,.36);opacity:0;pointer-events:none;transition:opacity 260ms ease;z-index:40}
.scrim2.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(110%);visibility:hidden;max-width:560px;margin:0 auto;touch-action:none;will-change:transform;display:flex;flex-direction:column;gap:10px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 4px}
.bigst{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px}
.bigst.on{background:#FFF3C4;color:#6B5300} .bigst.off{background:#4A4F57;color:#F2F3F5} .bigst.unknown{background:var(--bg);color:var(--muted)}
.bigst .bl{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.35)}
.bigst.on .bl{background:#FFCF4A;box-shadow:0 0 20px rgba(242,193,46,.8)}
@media (prefers-reduced-motion:reduce){.ign .frw .w{animation:none!important}.genp.on.flash{animation:none}.sheet,.scrim2{transition:opacity 200ms ease!important}}

/* ===== Живий інтерфейс: небо, погода, генератор, привітання, голосування ===== */
.facadec{overflow:hidden}
.sky{position:relative;height:74px;margin:-14px -10px 8px;border-radius:22px 22px 0 0;overflow:hidden;transition:background 1.2s ease}
.sky.dawn{background:linear-gradient(180deg,#F6C9A8 0%,#F9E2C8 55%,#F7F8FA 100%)}
.sky.day{background:linear-gradient(180deg,#9FD0F2 0%,#CFE8F8 60%,#F7F8FA 100%)}
.sky.dusk{background:linear-gradient(180deg,#8E7CC3 0%,#E9A48A 55%,#F4E3D8 100%)}
.sky.night{background:linear-gradient(180deg,#1E2A44 0%,#3B4A69 60%,#E9ECF0 100%)}
.sky.wx-cloud.day{background:linear-gradient(180deg,#B9C6D2 0%,#DCE3EA 60%,#F7F8FA 100%)}
.sky.wx-rain.day,.sky.wx-storm.day{background:linear-gradient(180deg,#8E9BA8 0%,#C6CFD8 60%,#F2F3F5 100%)}
.sky .orb{position:absolute;width:26px;height:26px;border-radius:50%;top:14px}
.sky.day .orb,.sky.dawn .orb{background:radial-gradient(circle,#FFF6C8 0%,#FFD45C 60%,#FFC23A 100%);box-shadow:0 0 22px rgba(255,200,70,.75)}
.sky.dusk .orb{background:radial-gradient(circle,#FFE0B0,#FF9F5A);box-shadow:0 0 22px rgba(255,140,80,.6)}
.sky.night .orb{background:radial-gradient(circle at 35% 35%,#FFFDF2,#E7E3CF);box-shadow:0 0 16px rgba(255,250,220,.45)}
.sky.night .orb::after{content:"";position:absolute;inset:-2px -6px 2px 6px;border-radius:50%;background:#2A3854}
.sky .stars{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background-image:radial-gradient(1px 1px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 33% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 58% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 76% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 34%,#dfe6ff 50%,transparent 51%),radial-gradient(1px 1px at 46% 8%,#fff 50%,transparent 51%)}
.sky.night .stars{opacity:.9}
.sky .cl{position:absolute;height:14px;border-radius:10px;background:rgba(255,255,255,.85);filter:blur(.3px);animation:drift 46s linear infinite}
.sky .cl::before,.sky .cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.sky .cl::before{width:18px;height:18px;left:8px;top:-9px}.sky .cl::after{width:14px;height:14px;left:22px;top:-6px}
.sky.night .cl{background:rgba(160,175,200,.35)}
.sky.wx-rain .cl,.sky.wx-storm .cl{background:rgba(120,132,146,.85)}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(560px)}}
.sky .drop{position:absolute;top:-12px;width:1.5px;height:10px;border-radius:1px;background:rgba(90,120,150,.55);animation:rain .9s linear infinite}
.sky.night .drop{background:rgba(200,215,235,.55)}
@keyframes rain{to{transform:translate(-6px,96px)}}
.sky .flake{position:absolute;top:-8px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 2px rgba(120,130,150,.4);animation:snow 4.8s linear infinite}
@keyframes snow{to{transform:translate(10px,96px)}}
.sky .fog{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,rgba(240,242,245,.95))}
.wxchip{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#23262B;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wxchip b{font-size:14px;letter-spacing:-.02em}
.sky.night .wxchip{background:rgba(30,40,60,.55);color:#EEF1F6}
/* генератор «дихає» */
.genbox{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:2px;z-index:2}
.genbox .gn{width:22px;height:16px;border-radius:4px;background:#2E3A33;box-shadow:inset 0 0 0 1.5px #43A36C;display:flex;align-items:center;justify-content:center}
.genbox .gn i{width:6px;height:6px;border-radius:50%;background:#5CE39A;box-shadow:0 0 8px #5CE39A;animation:gblink 1.6s ease-in-out infinite}
@keyframes gblink{50%{opacity:.45}}
.genbox .puff{position:absolute;left:14px;bottom:14px;width:8px;height:8px;border-radius:50%;background:rgba(150,160,170,.55);animation:puff 2.6s ease-out infinite}
.genbox .puff:nth-child(3){animation-delay:1.3s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.8}100%{transform:translate(6px,-26px) scale(1.8);opacity:0}}
/* привітання */
.greet{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
@keyframes greetin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.greet{animation:greetin 420ms var(--spring) 120ms backwards}
/* голосування: блиск переможця */
.bar i{position:relative;overflow:hidden}
.in-bars .bar i.win::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-110%);animation:sheen 900ms ease-out 520ms forwards}
@keyframes sheen{to{transform:translateX(110%)}}
@keyframes cntpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:none}}
.in-bars .cnt-win{display:inline-block;animation:cntpop 420ms var(--spring) 480ms backwards}
@media (prefers-reduced-motion:reduce){.sky .cl,.sky .drop,.sky .flake,.genbox .gn i,.genbox .puff,.greet,.in-bars .bar i.win::after,.in-bars .cnt-win{animation:none!important}.sky .drop,.sky .flake,.genbox .puff{display:none}}

/* ===== Темна тема ===== */
:root{--sky-end:#F7F8FA;--fac1:#F7F8FA;--fac2:#E9ECF0;--tw1:#D9DDE3;--tw2:#CDD2D9;--twbase:#B9BFC7;--twtxt:#5F6670;--twcnt:#3A3F47}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111317; --card:#1B1E24; --ink:#ECEEF1; --muted:#9AA1AB; --line:#2A2E36; --line2:#3A404A;
  --graph:#363C47; --grey:#6B7079; --yellow:#F2C12E; --yellow-d:#E2B01F;
  --ok-bg:#163326; --ok:#5FD39C; --bad-bg:#3A1C14; --bad:#FF9A7A; --info-bg:#262A31; --info:#C9CDD2; --soft:#20242B; --yel-bg:#3A3216; --yel-ink:#F2D27A;
  --glass:rgba(27,30,36,.72);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --shadow-3:0 2px 4px rgba(0,0,0,.45),0 14px 36px rgba(0,0,0,.5);
  --sky-end:#1C2028;--fac1:#1C2028;--fac2:#15181D;--tw1:#2B3039;--tw2:#242931;--twbase:#3A404A;--twtxt:#AEB4BD;--twcnt:#D5D9DE;
}
html{transition:background-color 300ms ease}
:root[data-theme="dark"] .btn.yellow,:root[data-theme="dark"] nav.tabs button.on,:root[data-theme="dark"] .iconbtn[style*="--yellow"]{color:#23262B}
:root[data-theme="dark"] .btn.graph{background:#363C47;color:#fff}
:root[data-theme="dark"] [style*="color:var(--graph)"]{color:#B4BAC3!important}
:root[data-theme="dark"] nav.tabs button{color:var(--muted)}
:root[data-theme="dark"] nav.tabs button.on{color:#23262B}
:root[data-theme="dark"] .btn.ghost{background:var(--card);border-color:var(--line2)}
:root[data-theme="dark"] nav.tabs{box-shadow:var(--shadow-3),inset 0 0 0 1px rgba(255,255,255,.06)}
:root[data-theme="dark"] .edge{background:linear-gradient(to top,rgba(17,19,23,.94),rgba(17,19,23,0))}
:root[data-theme="dark"] [style*="background:#fff"]{background:var(--soft)!important}
:root[data-theme="dark"] .input{background:var(--soft);border-color:var(--line2);color:var(--ink)}
:root[data-theme="dark"] .chip{background:var(--card);border-color:var(--line2)}
:root[data-theme="dark"] .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme="dark"] .fl .a{background:var(--soft)}
:root[data-theme="dark"] .flr.on .fa,:root[data-theme="dark"] .fl .a.p{filter:saturate(.9)}
:root[data-theme="dark"] .flr.on.inf .fa{background:#4A4430;color:#E9D79A}
:root[data-theme="dark"] .flr.unknown .fa{background:repeating-linear-gradient(135deg,var(--line2) 0 4px,transparent 4px 8px)}
:root[data-theme="dark"] .toast{background:rgba(236,238,241,.92);color:#111317}
:root[data-theme="dark"] .scrim2{background:rgba(0,0,0,.55)}
:root[data-theme="dark"] .frw.unknown .w{background:repeating-linear-gradient(135deg,#4A505B 0 2px,transparent 2px 4px)}
:root[data-theme="dark"] .frw.on.inf .w{background:#8C7B3E;box-shadow:none}
.facadec{background:linear-gradient(180deg,var(--fac1) 0%,var(--fac2) 100%)}
.tower{background:linear-gradient(180deg,var(--tw1),var(--tw2))}
.tower .nm{color:var(--twtxt)} .tower .base{background:var(--twbase)} .tower .cnt{color:var(--twcnt)}
.sky.dawn{background:linear-gradient(180deg,#F6C9A8 0%,#F9E2C8 55%,var(--sky-end) 100%)}
.sky.day{background:linear-gradient(180deg,#9FD0F2 0%,#CFE8F8 60%,var(--sky-end) 100%)}
.sky.dusk{background:linear-gradient(180deg,#8E7CC3 0%,#E9A48A 55%,var(--sky-end) 100%)}
.sky.night{background:linear-gradient(180deg,#1E2A44 0%,#3B4A69 60%,var(--sky-end) 100%)}
.sky.wx-cloud.day{background:linear-gradient(180deg,#B9C6D2 0%,#DCE3EA 60%,var(--sky-end) 100%)}
.sky.wx-rain.day,.sky.wx-storm.day{background:linear-gradient(180deg,#8E9BA8 0%,#C6CFD8 60%,var(--sky-end) 100%)}
.themesw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--line);border-radius:14px}
.themesw button{height:38px;border:none;border-radius:10px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.themesw button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
/* ===== Картка квартири ===== */
.aptc{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:24px;background:linear-gradient(135deg,var(--card) 0%,var(--soft) 100%);box-shadow:var(--shadow-2);border:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;position:relative;overflow:hidden}
.aptc .mini{width:74px;padding:5px 4px 4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--tw1),var(--tw2));display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.aptc .mr{display:flex;gap:1.5px;height:5px}
.aptc .mr i{flex:1;border-radius:1px;background:#4A4F57}
.aptc .mr.on i{background:#FFCF4A}
.aptc .mr.on.inf i{background:#F7DE8C}
.aptc .mr.unknown i{background:#C3C8CF;opacity:.6}
.aptc .mr i.me{background:var(--ink)!important;box-shadow:0 0 0 1.5px var(--card),0 0 8px 2px rgba(242,193,46,.9);animation:mepulse 2.4s ease-in-out infinite}
@keyframes mepulse{50%{box-shadow:0 0 0 1.5px var(--card),0 0 2px 0 rgba(242,193,46,.4)}}
.aptc .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.aptc .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.aptc .meta span{font-size:12px;font-weight:700;background:var(--bg);border-radius:999px;padding:4px 10px;color:var(--muted)}
.aptc .lt{margin-top:10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.aptc .lt i{width:8px;height:8px;border-radius:50%;background:#9AA1AB}
.aptc .lt.on i{background:#F2C12E;box-shadow:0 0 8px rgba(242,193,46,.9)} .aptc .lt.off i{background:#4A4F57}
.aptc .go{position:absolute;right:14px;top:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.aptc .mr i.me{animation:none}}

/* ---------- Різдвяна тема ---------- */
:root[data-xmas]{
  --bg:#0B181B; --card:#12252A; --soft:#173036; --line:#1D373D; --line2:#284850; --graph:#2B474D; --muted:#9BB4B1; --ink:#F1F5F2;
  --yellow:#F4C542; --yellow-d:#E4B02A; --red:#E0453F; --ok-bg:#12332A; --ok:#62D9A0; --info-bg:#1A3035; --yel-bg:#3A3015;
  --glass:rgba(18,37,42,.76); --sky-end:#13282C; --fac1:#13292E; --fac2:#0E1F23; --tw1:#22403F; --tw2:#1A3335; --twbase:#2D4E4F; --twtxt:#B9D0CC; --twcnt:#E2EEEA;
}
:root[data-xmas] body{background:radial-gradient(120% 60% at 50% -10%,#173A3F 0%,var(--bg) 60%) fixed,var(--bg)}
:root[data-xmas] .screen{padding-top:34px}
#xgar,#xsnow{display:none}
:root[data-xmas] #xgar{display:block;position:fixed;left:0;right:0;top:0;height:30px;z-index:6;pointer-events:none;max-width:560px;margin:0 auto}
#xgar svg{position:absolute;inset:0;width:100%;height:22px}
#xgar b{position:absolute;width:8px;height:11px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;margin-left:-4px;background:var(--c);box-shadow:0 0 8px 2px var(--c);animation:twk 2.4s ease-in-out infinite;animation-delay:var(--dl)}

/* ===== Дошка: паперові оголошення з відривними листочками ===== */
:root{--paper:#FFFFFF;--paper-ink:#23262B;--paper-mut:#6B7079;--board:#E4E1DA}

.brd{display:flex;flex-direction:column;gap:18px;padding:18px 12px 8px;margin:0 -4px;border-radius:26px;background:var(--board);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}

@keyframes rip{40%{transform:translateY(6px) rotate(-6deg)}100%{transform:translateY(60px) rotate(14deg);opacity:0}}

/* ===== Тема «Стихії»: вогонь, вода, земля і повітря разом ===== */
:root[data-el]{--bg:#0E1120;--card:#171B2D;--soft:#1E2338;--line:#262C45;--line2:#323A58;--graph:#323A58;--ink:#EEF0FF;--muted:#A2A8C6;--yellow:#F2A65A;--yellow-d:#E58A3A;

const FS = { y: 9999, v: 0, target: 9999, raf: 0, drag: null };
function fsEl() { return document.getElementById('fsheet'); }
function fsStep() {
  const el = fsEl(), k = 320, c = 2 * Math.sqrt(k), dt = 1 / 60;
  FS.v += (-k * (FS.y - FS.target) - c * FS.v) * dt; FS.y += FS.v * dt;
  el.style.transform = 'translateY(' + Math.max(-40, FS.y) + 'px)';
  if (Math.abs(FS.y - FS.target) > .5 || Math.abs(FS.v) > 5) FS.raf = requestAnimationFrame(fsStep);
  else { FS.y = FS.target; el.style.transform = 'translateY(' + FS.y + 'px)'; FS.raf = 0; if (FS.target > 0) el.style.visibility = 'hidden'; }
}
function fsTo(t, vel) {
  const el = fsEl(); FS.target = t; if (vel !== undefined) FS.v = vel; el.style.visibility = 'visible';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { FS.y = t; el.style.transform = 'translateY(' + t + 'px)'; if (t > 0) el.style.visibility = 'hidden'; return; }
  if (!FS.raf) FS.raf = requestAnimationFrame(fsStep);
}
function fsOpen() { const el = fsEl(); el.style.visibility = 'visible'; if (FS.y > 0) FS.y = el.offsetHeight + 40; document.getElementById('scrim2').classList.add('show'); fsTo(0, 0); }
function fsClose(vel) { document.getElementById('scrim2').classList.remove('show'); fsTo(fsEl().offsetHeight + 40, vel); }
function fsInit() {
  const el = fsEl(), sc = document.getElementById('scrim2');
  if (!el || el._init) return; el._init = 1;
  sc.onclick = () => fsClose();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fsClose(); });
  el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; FS.drag = { y0: e.clientY - FS.y, h: [[e.clientY, e.timeStamp]] }; el.setPointerCapture(e.pointerId); cancelAnimationFrame(FS.raf); FS.raf = 0; });
  el.addEventListener('pointermove', e => {
    if (!FS.drag) return;
    let ny = e.clientY - FS.drag.y0; if (ny < 0) ny = -(-ny * 120 * .55) / (120 + .55 * -ny);
    FS.y = ny; el.style.transform = 'translateY(' + ny + 'px)';
    FS.drag.h.push([e.clientY, e.timeStamp]); if (FS.drag.h.length > 5) FS.drag.h.shift();
  });
  el.addEventListener('pointerup', () => {
    if (!FS.drag) return;
    const h = FS.drag.h, a = h[0], b = h[h.length - 1], vel = b[1] > a[1] ? (b[0] - a[0]) / ((b[1] - a[1]) / 1000) : 0;
    FS.drag = null;
    const proj = FS.y + (vel / 1000) * .99 / (1 - .99);
    if (proj > el.offsetHeight * .45) fsClose(vel); else fsTo(0, vel);
  });
}

function vocative(full) {
  const n = String(full || '').trim().split(/\s+/)[0];
  if (!/^[А-ЯІЇЄҐ][а-яіїєґʼ']+$/.test(n)) return '';
  if (/ія$/.test(n)) return n.slice(0, -1) + 'є';      // Юлія → Юліє
  if (/[^і]я$/.test(n)) return n.slice(0, -1) + 'ю';   // Таня → Таню
  if (/а$/.test(n)) return n.slice(0, -1) + 'о';       // Олена → Олено
  if (/й$/.test(n)) return n.slice(0, -1) + 'ю';       // Андрій → Андрію
  if (/[бвдзлмнпрстф]$/.test(n)) return n + 'е';       // Іван → Іване
  return '';
}

// ---------- голосування ----------
function polls() {
  const list = D.polls;
  const open = list.filter(p => p.open), closed = list.filter(p => !p.open);
  return '<div class="h1" role="heading" aria-level="1">Голосування</div>' +
    (open.length ? open.map(pollCard).join('') : '<div class="empty">Активних опитувань немає</div>') +
    (closed.length ? '<div class="label">Завершені</div>' + closed.map(pollCard).join('') : '');
}
function canVoteIn(p) { return p.open && (!p.ownersOnly || isOwner()) && D.me.apt && !isFamily(); }
function noVoteNote(p) {
  if (!p.open) return '';
  if (isFamily()) return '<div class="note">Члени сімʼї бачать результати. Голосує власник або орендар квартири.</div>';
  if (p.ownersOnly && !isOwner()) return '<div class="note">Голосують власники. Ви бачите результати.</div>';
  return '';
}
function shortOpt(o) { return String(o).replace(/:00/g, ''); }
function multiPollCard(p) {
  const canVote = canVoteIn(p);
  const editing = canVote && (!p.voted || ui.editing[p.id]);
  if (editing && !ui.sel[p.id]) ui.sel[p.id] = (p.voted || []).slice();
  const sel = ui.sel[p.id] || [];
  const max = Math.max.apply(null, p.counts.concat([1]));
  const top = p.counts.map((c, i) => [c, i]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);
  let h = '<div class="card" style="gap:12px;padding:18px;border-radius:24px"><div class="row"><span class="tag ' + (p.open ? 'yel' : 'soft') + '">' + (p.open ? 'Триває' : 'Завершено') + '</span><span class="sub" style="font-weight:500">можна обрати кілька</span></div>' +
    '<div style="font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.01em">' + esc(p.question) + '</div>';
  if (editing) {
    h += '<div class="sub">Позначте всі зручні для вас варіанти</div><div class="grid3">' +
      p.options.map((o, i) => '<button class="chip' + (sel.indexOf(o) >= 0 ? ' on' : '') + '" style="height:42px;padding:0 4px" onclick="pickMulti(' + p.id + ',' + i + ')">' + esc(shortOpt(o)) + '</button>').join('') + '</div>' +
      '<div class="row" style="gap:8px"><button class="btn yellow" style="flex:1" onclick="saveMulti(' + p.id + ')"' + (sel.length ? '' : ' disabled') + '>Зберегти' + (sel.length ? ' (' + sel.length + ')' : '') + '</button>' +
      (p.voted ? '<button class="btn ghost" onclick="ui.editing[' + p.id + ']=false;ui.sel[' + p.id + ']=null;render()">Скасувати</button>' : '') + '</div>';
  } else if (p.voted) {
    h += '<div style="background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45">Вибір квартири: ' + p.voted.map(shortOpt).map(esc).join(', ') + '</div>' +
      (canVote ? '<button class="btn sm ghost" style="align-self:flex-start" onclick="ui.editing[' + p.id + ']=true;render()">Змінити вибір</button>' : '');
  } else h += noVoteNote(p);
  if (!editing || D.me.isAdmin) {
    h += '<div class="row sub"><span>Проголосувало квартир</span><span>' + p.total + '</span></div>';
    if (top.length) h += '<div style="font-size:14px;font-weight:700">Найпопулярніші: ' + top.map(i => esc(shortOpt(p.options[i]))).join(', ') + '</div>';
    h += '<div style="display:flex;flex-direction:column;gap:5px">' + p.options.map((o, i) => {
      const w = Math.round(p.counts[i] / max * 100);
      return '<div style="display:grid;grid-template-columns:62px 1fr 32px;align-items:center;gap:8px;font-size:13px;font-weight:600"><span>' + esc(shortOpt(o)) + '</span>' +
        '<div class="bar" style="height:10px"><i' + (top.indexOf(i) >= 0 ? ' class="win"' : '') + ' style="width:' + w + '%;background:' + (top.indexOf(i) >= 0 ? 'var(--yellow-d)' : 'var(--graph)') + '"></i></div><span style="text-align:right"' + (top.indexOf(i) >= 0 ? ' class="cnt-win"' : '') + '>' + p.counts[i] + '</span></div>';
    }).join('') + '</div>';
  }
  return h + adminPollBtns(p) + '</div>';
}
function adminPollBtns(p) {
  if (!D.me.isAdmin) return '';
  return '<div class="row" style="justify-content:flex-start;gap:8px">' +
    (p.open ? '<button class="btn sm ghost" onclick="run(\'closePoll\',{id:' + p.id + '},\'Опитування завершено\')">Завершити</button>' : '') +
    '<button class="btn sm ghost" style="color:var(--bad)" onclick="delPoll(' + p.id + ')">Видалити</button></div>';
}
function pickMulti(id, i) {
  const p = D.polls.find(x => x.id === id); const o = p.options[i];
  const s = ui.sel[id] || (ui.sel[id] = []);
  const k = s.indexOf(o); if (k >= 0) s.splice(k, 1); else s.push(o);
  haptic(); render();
}
async function saveMulti(id) {
  const s = ui.sel[id] || [];
  if (!s.length) return;
  ui.anim = 'bars';
  if (await run('vote', { id: id, options: s }, 'Вибір збережено')) { ui.sel[id] = null; ui.editing[id] = false; ui.anim = 'bars'; render(); haptic('ok'); } else ui.anim = '';
}
function pollCard(p) {
  if (p.multi) return multiPollCard(p);
  const canVote = canVoteIn(p);
  const showRes = !p.open || p.voted || !canVote || D.me.isAdmin;
  const colors = ['var(--ok)', 'var(--yellow-d)', 'var(--grey)', 'var(--graph)', '#8A6D00'];
  let h = '<div class="card" style="gap:12px;padding:18px;border-radius:24px"><div class="row"><span class="tag ' + (p.open ? 'yel' : 'soft') + '">' + (p.open ? 'Триває' : 'Завершено') + '</span><span class="sub" style="font-weight:500">1 квартира = 1 голос</span></div>' +
    '<div style="font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.01em">' + esc(p.question) + '</div>';
  if (showRes) {
    h += '<div class="row sub"><span>Проголосувало квартир</span><span>' + p.total + '</span></div>';
    h += p.options.map((o, i) => {
      const pct = p.total ? Math.round(p.counts[i] / p.total * 100) : 0, win = p.counts[i] > 0 && p.counts[i] === Math.max.apply(null, p.counts);
      return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="font-size:14px;font-weight:600"><span>' + esc(o) + (p.voted === o ? ' · голос квартири' : '') + '</span><span' + (win ? ' class="cnt-win"' : '') + '>' + p.counts[i] + ' (' + pct + '%)</span></div><div class="bar" style="height:8px"><i' + (win ? ' class="win"' : '') + ' style="width:' + pct + '%;background:' + colors[i % colors.length] + '"></i></div></div>';
    }).join('');
  }
  if (canVote) {
    h += '<div style="display:flex;flex-direction:column;gap:8px">' + (p.voted ? '<div class="sub">Змінити голос:</div>' : '') +
      p.options.map(o => '<button class="btn ' + (p.voted === o ? 'yellow' : 'ghost') + '" onclick="vote(' + p.id + ',this.dataset.o)" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  } else h += noVoteNote(p);
  h += adminPollBtns(p);
  h += '<div style="font-size:12px;color:var(--muted);line-height:1.45">Це опитування для оцінки думки мешканців, не офіційне голосування ОСББ.</div>';
  return h + '</div>';
}
function delPoll(id) {
  ask('Видалити опитування разом з усіма голосами? Це не можна скасувати.', ok => { if (ok) run('deletePoll', { id: id }, 'Опитування видалено'); });
}

// ---------- паливо / ключ від ліфта (добровільний внесок) ----------
const MONTH_IN = ['січні', 'лютому', 'березні', 'квітні', 'травні', 'червні', 'липні', 'серпні', 'вересні', 'жовтні', 'листопаді', 'грудні'];
const MONTH_GEN = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
function fmtUpd(t) { const d = new Date(t); return d.getDate() + ' ' + MONTH_GEN[d.getMonth()] + ' о ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function monthIn(k) { const m = Number(String(k).slice(5, 7)); return MONTH_IN[m - 1] || monthName(k); }
function monthName(k) { try { return new Date(k + '-01T12:00:00').toLocaleDateString('uk-UA', { month: 'long' }); } catch (e) { return k; } }
function fuelState() { const f = D.fuel; return f && D.me.apt ? f.key : null; }
function payFuel() {

    } catch (e) { toast(e.message || 'Не вдалося розібрати таблицю'); }

    fuelTableNote(a) + '</div>';
  const tabs = [['unknown', 'Без квартири · ' + unk.length], ['apts', 'Квартири'], ['ignored', 'Відкладені' + (ign.length ? ' · ' + ign.length : '')]];

function fmtMoney(n) { return Math.round(n || 0).toLocaleString('uk-UA').replace(/\s/g, ' '); }
function payDate(t) { try { return new Date(t).toLocaleString('uk-UA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ago(t); } }

// квартири: зведення з платежів місяця + зареєстрованих + заяв «оплатив»
function fuelApts() {
  const f = D.fuel, a = f.admin, by = {};
  const get = apt => by[apt] || (by[apt] = { apt: apt, sum: 0, pays: [], reg: false, claim: false });
  (a.all || a.reg || []).forEach(x => { get(x); });
  (a.reg || []).forEach(x => { get(x).reg = true; });
  (a.pays || []).forEach(p => { const o = get(p.apt); o.sum += p.sum; o.pays.push(p); });
  (a.claims || []).forEach(c => { get(c.apt).claim = true; });
  return Object.keys(by).map(k => {
    const o = by[k];
    o.need = Math.max(0, Math.round((fAmt() - o.sum) * 100) / 100);
    o.st = o.sum >= fAmt() + 100 ? 'over' : o.sum >= fAmt() - 0.01 ? 'paid' : o.sum > 0 ? 'part' : o.claim ? 'claim' : 'none';
    o.pays.sort((x, y) => y.date - x.date);
    return o;
  }).sort((x, y) => parseInt(x.apt, 10) - parseInt(y.apt, 10) || x.apt.localeCompare(y.apt));
}
const FUEL_ST = { paid: ['ok', 'внесено'], over: ['info', 'переплата'], part: ['yel', 'частково'], claim: ['yel', 'заявили'], none: ['bad', 'ще ні'] };
// нерозпізнані платежі, що закривають борг квартири (сума = скільки бракує)
function fuelCandidates(apt) {
  return (D.fuel.admin.unknown || []).filter(u => apt.need > 0 && Math.abs(u.sum - apt.need) < 0.5);
}
function fuelHintsFor(u) {
  return fuelApts().filter(o => o.st === 'part' && Math.abs(u.sum - o.need) < 0.5);
}
function fuelSenderHint(u) {
  if (!u.sender) return '';
  const k = u.sender.toLowerCase(), apts = [];
  (D.fuel.admin.pays || []).forEach(p => { if (p.sender && p.sender.toLowerCase() === k && apts.indexOf(p.apt) < 0) apts.push(p.apt); });
  return apts.length ? '<div class="sub" style="font-weight:500">Цей відправник цього місяця вже платив за кв.\u00a0' + apts.map(esc).join(', ') + '. Перевірте, чи це та сама квартира.</div>' : '';
}

function importCsv(input) {

    }
  };
  r.onerror = () => toast('Не вдалося прочитати файл');
  r.readAsText(file, 'utf-8');
}

function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = () => ok(window.XLSX); sc.onerror = () => no(new Error('Не вдалося завантажити модуль для xlsx. Збережіть таблицю як CSV і спробуйте ще раз.')); document.head.appendChild(sc); });
}
// з таблиці беремо 1-шу колонку (квартира) і суму: колонку G, якщо в таблиці 7+ колонок, інакше 2-гу
function tableRows(grid) {
  const wide = grid.some(r => r && r.length >= 7);
  return grid.filter(r => r && r[0] !== undefined && r[0] !== null && String(r[0]).trim() !== '').map(r => [String(r[0]).trim(), wide ? r[6] : r[1]])
    .filter(r => !/^(кв|квартира|№|внески|разом|всього)/i.test(r[0]));
}
function fuelTableFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  input.value = '';
  const isCsv = /\.csv$/i.test(file.name);
  const r = new FileReader();
  r.onerror = () => toast('Не вдалося прочитати файл');
  r.onload = async () => {
    try {
      let grid;
      if (isCsv) grid = String(r.result).split(/\r?\n/).map(l => l.split(/[;,\t]/));
      else { const X = await loadXlsxLib(); const wb = X.read(r.result, { type: 'array' }); grid = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true }); }
      const rows = tableRows(grid);
      if (!rows.length) { toast('У таблиці не знайдено квартир'); return; }
      if (await run('fuelTable', { rows: rows })) {
        const t = D.tableResult || {};
        toast('Таблиця: ' + t.rows + ' кв. на ' + fmtMoney(t.sum) + ' грн');
        ui.fSel = ''; haptic('ok'); render();
      }
    } catch (e) { toast(e.message || 'Не вдалося розібрати таблицю'); }
  };
  if (isCsv) r.readAsText(file, 'utf-8'); else r.readAsArrayBuffer(file);
}

    else { db.sigMerged = false; db.signals.unshift({ id: now, t: now, act: now, sec: d.wholeHouse ? 0 : db.me.entrance, type: d.type, det: d.det, n: 1, ok: 0, own: true, too: false, myOk: false, reply: '', replyAt: 0, closed: '', ticket: 0, apt: db.me.apt }); }
  }
  if (action === 'sigMe') { const g = db.signals.find(x => x.id === d.id); if (g) { if (d.ok) { g.myOk = !g.myOk; g.ok += g.myOk ? 1 : -1; if (g.myOk && g.too) { g.too = false; g.n--; } if (g.own || g.ok >= 2) g.closed = 'вже працює'; } else { g.too = !g.too; g.n += g.too ? 1 : -1; } g.act = now; } }
  if (action === 'sigReply') { const g = db.signals.find(x => x.id === d.id); if (g) { g.reply = d.text; g.replyAt = now; } }
  if (action === 'sigClose') { const g = db.signals.find(x => x.id === d.id); if (g) g.closed = 'закрив адміністратор'; }
  if (action === 'sigTicket') { const g = db.signals.find(x => x.id === d.id); if (g) { const id = Math.max(...db.problems.map(p => p.id)) + 1; db.problems.unshift({ id: id, created: g.t, entrance: g.sec, category: g.type === 'lift' ? 'Ліфт' : 'Інше', place: g.det, text: sigTitle(g) + ' · сигнал від ' + g.n + ' кв.', status: 'Нова', count: g.n, mine: !g.own, own: g.own, comments: [] }); g.closed = 'стало заявкою № ' + id; g.ticket = id; } }
  if (action === 'adNew') db.ads.unshift({ id: now, t: now, cat: d.cat, title: d.title, text: d.text, price: d.price, contact: d.contact || '@' + db.me.username, name: db.me.name.split(' ')[0], sec: db.me.entrance, own: true, apt: db.me.apt });
  if (action === 'adClose' || action === 'adDel') db.ads = db.ads.filter(a => a.id !== d.id);
  if (action === 'osbbImport' && db.osbb) { db.osbb.nonum.unshift(['17.06.2026 12:19', 300, 'Квартира 292', 90, '292', 'Микола Д.', 'виписка: коментар'], ['18.06.2026 10:39', 500, 'Поповнення рахунку Банки', 91, '', 'Олена Б.', '']); db.osbbImportResult = { added: 2, linked: 1, free: 1 }; db.osbb.lastImport = { at: now, added: 2 }; }
  if (action === 'osbbLink' && db.osbb) { const x = db.osbb.nonum.find(n => n[3] === d.row); if (x) x[4] = d.apt || ''; }
  if (action === 'comment') { const p = db.problems.find(x => x.id === d.id); (p.comments = p.comments || []).push({ id: 'c' + now, t: now, who: db.me.isAdmin ? 'Адміністратор' : p.own ? 'Автор заявки' : 'Власник', text: d.text, mine: true }); }
  if (action === 'delComment') db.problems.forEach(p => { p.comments = (p.comments || []).filter(c => c.id !== d.cid); });
  if (action === 'metoo') { const p = db.problems.find(x => x.id === d.id); p.mine = !p.mine; p.count += p.mine ? 1 : -1; }
  if (action === 'newProblem') db.problems.unshift({ id: 15, created: now, entrance: d.wholeHouse ? 0 : 2, category: d.category, place: d.place, text: d.text, status: 'Нова', count: 1, mine: false, own: true, authorApt: '317-1' });
  if (action === 'vote' && d.options) { const p = db.polls.find(x => x.id === d.id); if (p.voted) p.voted.forEach(o => p.counts[p.options.indexOf(o)]--); else p.total++; p.voted = p.options.filter(o => d.options.indexOf(o) >= 0); p.voted.forEach(o => p.counts[p.options.indexOf(o)]++); }
  else if (action === 'vote') { const p = db.polls.find(x => x.id === d.id); if (p.voted) { p.counts[p.options.indexOf(p.voted)]--; } else p.total++; p.voted = d.option; p.counts[p.options.indexOf(d.option)]++; }
  if (action === 'problemStatus') { const x = db.problems.find(y => y.id === d.id); x.status = d.status; if (d.status === 'Вирішено') x.confirm = ''; }
  if (action === 'confirmProblem') { const x = db.problems.find(y => y.id === d.id); if (d.ok) x.confirm = 'підтверджено'; else { x.status = 'В роботі'; x.confirm = 'не вирішено'; } }
  if (action === 'setStatus') { const s = db.statuses.find(x => x.row === d.row); s.value = d.value; s.tone = d.tone; }
  if (action === 'lightSet') [1, 2, 3, 4].forEach(n => { if (!d.section || d.section === n) L[n] = { status: d.on ? 'on' : 'off', since: now, at: now, by: 'admin' }; });
  if (action === 'urgent') db.news.unshift({ time: now, entrance: d.entrance, text: d.text });
  if (action === 'newPoll') db.polls.unshift({ id: 3, question: d.question, options: d.options, counts: d.options.map((_, i) => [3, 2, 4, 6, 5, 4, 3, 4, 5, 7, 9, 14, 18, 21, 19, 12, 6][i] || 0), open: true, ownersOnly: d.ownersOnly, multi: d.multi, voted: null, total: 31 });
  if (action === 'closePoll') db.polls.find(x => x.id === d.id).open = false;
  if (action === 'deletePoll') db.polls = db.polls.filter(x => x.id !== d.id);
  const f = db.me.flat;
  if (db.fuel && db.fuel.admin && /^fuel(Manual|Assign|Unassign|Ignore|Unmark|Table|InTable|TableClear|Delete|SetApt|Settings|Skip)$/.test(action)) demoFuelAct(db, action, d, now);
  if (action === 'fuelClaim') db.fuel.key = 'claimed';
  if (action === 'importCsv') { db.importResult = { added: 12, known: 10, unknown: 2 }; db.fuel.admin.lastImport = { at: now, added: 12 }; }
  if (action === 'invite') { if (!f.left) return Promise.reject(new Error('На квартиру вже додано або запрошено 3 людини')); f.openInvites++; f.left--; db.invite = 'https://t.me/budynok10_bot?start=inv_' + Math.random().toString(16).slice(2, 14); }
  if (action === 'cancelInvites') { f.left += f.openInvites; f.openInvites = 0; }
  if (action === 'removeMember') { f.members = f.members.filter(m => m.id !== d.id); f.left++; }
  if (db.fuel && db.fuel.admin && db.fuel.admin.pays) demoFuelRecalc(db);
  return new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(db))), 250));
}

setInterval(() => { if ((route === 'home' || route === 'light') && !document.hidden && !busy && !document.querySelector('.osed,.sheet[style*="visible"]')) { const p = dayPhase(); if (ui.lastPhase && ui.lastPhase !== p) render(); ui.lastPhase = p; } }, 60000);
try { applyTheme(); } catch (e) {}
start();
